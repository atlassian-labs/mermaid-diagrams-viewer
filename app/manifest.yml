app:
  id: ari:cloud:ecosystem::app/23392b90-4271-4239-98ca-a3e96c663cbb
  runtime:
    name: nodejs24.x

modules:
  macro:
    - key: mermaid-diagram
      resource: custom-ui
      title: Mermaid diagram
      icon: resource:icons;app-icon.png
      description: Render a Mermaid diagram from a code block on a page
      categories:
        - formatting
        - confluence-content
        - visuals
        - development
      config:
        resource: custom-ui
        viewportSize: small
        title: Mermaid diagram configuration
      resolver:
        function: resolver

  confluence:globalSettings:
    - key: mermaid-admin
      resource: custom-ui
      resolver:
        function: resolver
      title: Mermaid Diagrams Viewer
      useAsConfig: true

  function:
    - key: resolver
      handler: index.handler

  objectStore:
    - key: icon-packs
      storageClass: standard

resources:
  - key: custom-ui
    path: build/custom-ui
    tunnel:
      port: 5173
  - key: icons
    path: icons

permissions:
  enforcement: app-managed
  scopes:
    - read:page:confluence
    - storage:app
  content:
    styles:
      - unsafe-inline
